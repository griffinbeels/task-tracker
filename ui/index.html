<!doctype html>
<html>
  <head><meta charset="utf-8">
    <link rel="stylesheet" href="vendor/toastui-editor.min.css">
    <link rel="stylesheet" href="vendor/toastui-editor-dark.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- id, because zoom.js addresses every scalable region by one — the
         header only scales when the setting says so, and clearing its zoom
         again is what puts it back. -->
    <header id="app-header">
      <select id="project-picker"></select>
      <button id="add-project">+</button>
      <button id="capture-button">Capture</button>
      <button id="inbox-button" hidden></button>
      <button id="progress-button">Progress</button>
      <button id="restart-button" class="icon" title="Restart Task Tracker">↻</button>
      <button id="settings-button" class="icon" title="Settings">⚙</button>
    </header>
    <div id="toolbar">
      <input id="search" placeholder="Search all projects">
      <label><input type="checkbox" id="all-projects"> All projects</label>
      <button id="spin-up" disabled title="Opens a Claude session in this project. Tick tasks first to start it with them typed in.">Spin up Claude</button>
    </div>
    <!-- Two rows in one bar: what you can DO to the selection, and — at two or
         more — what to name the session it is about to become. The name is a
         property of the selection, so it lives inside the selection's own
         component rather than stacking a second bar beneath it. Each row hides
         independently; the bar hides when nothing is ticked.

         It is drawn floating over the BOTTOM of the window (style.css), not
         where it sits here, and nothing is laid out against it. It stays at
         this point in the markup for one reason: every overlay below is
         position: fixed at z-index auto, so they paint over it in DOM order.
         Moved after them, the bar would cover an open editor. -->
    <div id="selection-bar" hidden>
      <div class="actions">
        <span id="selection-count"></span>
        <span class="spacer"></span>
        <button id="selection-done">Done</button>
        <button id="selection-delete" class="danger">Delete</button>
        <button id="selection-clear" class="quiet">Clear</button>
      </div>
      <div id="handoff-name" hidden>
        <span class="field-label">Name</span>
        <input id="handoff-name-input">
      </div>
    </div>
    <div id="group-limit-warning" hidden></div>
    <div id="unreadable-warning" hidden></div>
    <main id="task-list"></main>

    <!-- Write first, name it second. The title sits BELOW the body because you
         do not know what a thought is called until you have finished having
         it. -->
    <div id="editor" class="overlay" hidden>
      <div id="editor-progress"></div>
      <div id="editor-body"></div>
      <div id="editor-meta">
        <input id="editor-title" placeholder="Name it — this is what you'll see in the list">
        <div class="field" id="editor-project-field">
          <span class="field-label">Project</span>
          <div id="editor-projects" class="chips"></div>
        </div>
        <div class="field">
          <span class="field-label">Type</span>
          <div id="editor-types" class="chips"></div>
        </div>
        <div class="field">
          <span class="field-label">When</span>
          <div id="editor-buckets" class="chips"></div>
        </div>
        <p class="field-hint" id="editor-bucket-hint" hidden></p>
        <div class="field" id="editor-group-field">
          <span class="field-label">Group</span>
          <div id="editor-groups" class="chips"></div>
        </div>
        <div class="field">
          <span class="field-label">Colour</span>
          <div id="editor-colors" class="chips"></div>
        </div>
      </div>
      <div class="actions">
        <button id="editor-save" class="primary">File</button>
        <button id="editor-restore">Restore</button>
        <button id="editor-later">Later</button>
        <button id="editor-skip">Skip</button>
        <button id="editor-discard" class="danger">Discard</button>
        <span class="spacer"></span>
        <button id="editor-cancel" class="quiet">Cancel</button>
      </div>
    </div>

    <div id="progress" class="overlay" hidden>
      <div id="progress-body"></div>
      <div class="actions"><button id="progress-close">Close</button></div>
    </div>

    <div id="settings" class="overlay" hidden>
      <label>Group limit <input id="group-limit" type="number" min="1"></label>
      <p class="setting-hint">Tasks handed to one Claude session count as one group.</p>
      <label>Stale after (days) <input id="stale-days" type="number" min="1"></label>
      <label><input type="checkbox" id="zoom-whole-window">
        Scale the header and toolbar too</label>
      <p class="setting-hint">Ctrl + and Ctrl − resize the task list, Progress and
        Settings. Tick this and the top two rows grow with them.</p>
      <div id="type-editor"></div>
      <button id="add-type">Add type</button>
      <div id="tracked-editor"></div>
      <div class="actions"><button id="settings-save">Save</button>
        <button id="settings-close">Close</button></div>
    </div>

    <!-- What the last Ctrl+/- did. Outside every zoom region on purpose: a
         readout that scaled with the thing it is reporting on could not report
         the size it had just been given, and it has to sit above the editor
         overlay to be visible while the editor is the thing being sized. -->
    <div id="zoom-badge" hidden></div>

    <script src="vendor/toastui-editor-all.min.js"></script>
    <script src="state.js"></script>
    <script src="zoom.js"></script>
    <script src="tasks.js"></script>
    <script src="groups.js"></script>
    <script src="inprogress.js"></script>
    <script src="selection.js"></script>
    <script src="editor.js"></script>
    <script src="triage.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
